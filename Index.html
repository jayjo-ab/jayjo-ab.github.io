<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RP Strip Poker – Gwen & Maya</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontSize: {
                        'xxs': '0.65rem',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            margin: 0 20px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-slate-900 text-white m-0 p-0 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        /** @jsx React.createElement */
        const { useState, useEffect } = React;

        // ---------- Storage Helpers ----------
        const STORAGE_KEYS = {
            config: 'rp_poker_config_v1',
            clothesState: 'rp_poker_clothes_state_v1'
        };

        const DEFAULT_CONFIG = {
            numOpponents: 2,
            playerName: '{{user}}',
            playerClothes: 'Jacket, Shirt, Pants, Underwear',
            playerPlaystyle: 'normal',
            opponents: [
                { name: 'Gwen', clothes: 'Blue Top worn as dress, pantyhose, Bra, Panties', playstyle: 'normal' },
                { name: 'Maya', clothes: 'Off Shoulder Too, Skirt, Bra, Panties', playstyle: 'normal' }
            ]
        };

        function loadConfig() {
            try {
                const stored = localStorage.getItem(STORAGE_KEYS.config);
                if (stored) return JSON.parse(stored);
            } catch (e) {}
            return DEFAULT_CONFIG;
        }

        function saveConfig(config) {
            try {
                localStorage.setItem(STORAGE_KEYS.config, JSON.stringify(config));
            } catch (e) {}
        }

        // ---------- Card & Deck ----------
        const getDeck = () => {
            const suits = ['♥', '♦', '♣', '♠'];
            const values = [
                { char: '2', val: 2 }, { char: '3', val: 3 }, { char: '4', val: 4 },
                { char: '5', val: 5 }, { char: '6', val: 6 }, { char: '7', val: 7 },
                { char: '8', val: 8 }, { char: '9', val: 9 }, { char: '10', val: 10 },
                { char: 'J', val: 11 }, { char: 'Q', val: 12 }, { char: 'K', val: 13 },
                { char: 'A', val: 14 }
            ];
            let newDeck = [];
            for (let s of suits) {
                for (let v of values) {
                    newDeck.push({ suit: s, char: v.char, val: v.val });
                }
            }
            for (let i = newDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newDeck[i], newDeck[j]] = [newDeck[j], newDeck[i]];
            }
            return newDeck;
        };

        // ---------- Hand Evaluator ----------
        const evaluateHand = (cards) => {
            const sorted = [...cards].sort((a, b) => b.val - a.val);
            const isFlush = cards.every(c => c.suit === cards[0].suit);
            let isStraight = false;
            let isA5Straight = false;
            if (sorted[0].val === 14 && sorted[1].val === 5 && sorted[2].val === 4 && sorted[3].val === 3 && sorted[4].val === 2) {
                isStraight = true;
                isA5Straight = true;
            } else {
                isStraight = sorted.every((c, i) => i === 0 || sorted[i-1].val - c.val === 1);
            }
            const counts = {};
            sorted.forEach(c => counts[c.val] = (counts[c.val] || 0) + 1);
            const freqs = Object.entries(counts).map(([v, c]) => ({ val: parseInt(v), count: c })).sort((a, b) => {
                if (a.count !== b.count) return b.count - a.count;
                return b.val - a.val;
            });
            let rank = 0, rankName = "";
            if (isStraight && isFlush) {
                if (!isA5Straight && sorted[0].val === 14) { rank = 8; rankName = "Royal Flush"; }
                else { rank = 8; rankName = "Straight Flush"; }
            } else if (freqs[0].count === 4) { rank = 7; rankName = "Four of a Kind"; }
            else if (freqs[0].count === 3 && freqs[1].count === 2) { rank = 6; rankName = "Full House"; }
            else if (isFlush) { rank = 5; rankName = "Flush"; }
            else if (isStraight) { rank = 4; rankName = "Straight"; }
            else if (freqs[0].count === 3) { rank = 3; rankName = "Three of a Kind"; }
            else if (freqs[0].count === 2 && freqs[1].count === 2) { rank = 2; rankName = "Two Pair"; }
            else if (freqs[0].count === 2) { rank = 1; rankName = "Pair"; }
            else { rank = 0; rankName = "High Card"; }

            let tieBreakerStr = "";
            if (isA5Straight) tieBreakerStr = "0504030201";
            else tieBreakerStr = freqs.map(f => f.val.toString(16).padStart(2,'0').repeat(f.count)).join('');
            let scoreHex = rank.toString(16) + tieBreakerStr;
            let score = parseInt(scoreHex, 16);
            return { rankName, score };
        };

        // ---------- AI Discard Logic ----------
        const getAIDiscards = (hand, playstyle) => {
            const basic = () => {
                const counts = {};
                hand.forEach((c, i) => {
                    if (!counts[c.val]) counts[c.val] = [];
                    counts[c.val].push(i);
                });
                const pairsOrBetter = Object.values(counts).filter(indices => indices.length >= 2).flat();
                if (pairsOrBetter.length > 0) return [0,1,2,3,4].filter(i => !pairsOrBetter.includes(i));
                const suitCounts = {};
                hand.forEach((c, i) => {
                    if (!suitCounts[c.suit]) suitCounts[c.suit] = [];
                    suitCounts[c.suit].push(i);
                });
                const fourFlush = Object.values(suitCounts).find(indices => indices.length === 4);
                if (fourFlush) return [0,1,2,3,4].filter(i => !fourFlush.includes(i));
                const sortedIndices = hand.map((c,i) => ({val: c.val, idx: i})).sort((a,b) => b.val - a.val);
                return [sortedIndices[2].idx, sortedIndices[3].idx, sortedIndices[4].idx];
            };

            if (playstyle === 'safe') {
                const keep = hand.map((c,i) => c.val >= 10 ? i : -1).filter(i => i >= 0);
                if (keep.length >= 2) return [0,1,2,3,4].filter(i => !keep.includes(i));
                return basic();
            }
            if (playstyle === 'risky') {
                const suits = {};
                hand.forEach((c,i) => { if (!suits[c.suit]) suits[c.suit] = []; suits[c.suit].push(i); });
                const flushDraw = Object.values(suits).find(indices => indices.length >= 3);
                if (flushDraw && flushDraw.length < 5) return [0,1,2,3,4].filter(i => !flushDraw.includes(i));
                const sorted = [...hand].sort((a,b) => a.val - b.val);
                let straightCandidates = [];
                for (let i = 0; i < sorted.length - 2; i++) {
                    if (sorted[i+1].val - sorted[i].val === 1 && sorted[i+2].val - sorted[i+1].val === 1) {
                        straightCandidates = [sorted[i], sorted[i+1], sorted[i+2]];
                        break;
                    }
                }
                if (straightCandidates.length === 3) {
                    const indices = straightCandidates.map(c => hand.indexOf(c));
                    return [0,1,2,3,4].filter(i => !indices.includes(i));
                }
                return basic();
            }
            return basic();
        };

        // ---------- Special draw for Lucky/Unlucky (Rigging) ----------
        const drawCardsWithLuck = (deck, count, lucky) => {
            const drawn = [];
            for (let i = 0; i < count; i++) {
                if (deck.length === 0) break;
                if (deck.length < 3) {
                    drawn.push(deck.shift());
                } else {
                    const candidates = [deck.shift(), deck.shift(), deck.shift()];
                    const chosen = lucky
                        ? candidates.reduce((a,b) => a.val > b.val ? a : b)
                        : candidates.reduce((a,b) => a.val < b.val ? a : b);
                    drawn.push(chosen);
                    candidates.forEach(c => { if (c !== chosen) deck.push(c); });
                }
            }
            return drawn;
        };

        // ---------- Card Component ----------
        const Card = ({ card, hidden, selected, onClick }) => {
            if (hidden) {
                return (
                    <div className="flex-shrink-0 w-10 h-14 sm:w-12 sm:h-16 bg-blue-900 rounded-md border-2 border-white/80 shadow-lg flex items-center justify-center p-1">
                        <div className="w-full h-full border border-blue-400 rounded-sm opacity-50 bg-[repeating-linear-gradient(45deg,transparent,transparent_3px,#ffffff22_3px,#ffffff22_6px)]"></div>
                    </div>
                );
            }
            const isRed = card.suit === '♥' || card.suit === '♦';
            return (
                <div 
                    onClick={onClick}
                    className={`relative flex-shrink-0 w-10 h-14 sm:w-12 sm:h-16 bg-white rounded-md border border-gray-300 shadow-md flex flex-col justify-between p-0.5 sm:p-1 select-none transition-all duration-200 
                    ${onClick ? 'cursor-pointer' : 'cursor-default'}
                    ${selected ? '-translate-y-3 sm:-translate-y-4 ring-2 ring-blue-500 shadow-blue-500/50' : (onClick ? 'hover:-translate-y-1' : '')}
                    ${isRed ? 'text-red-600' : 'text-slate-900'}`}
                >
                    {selected && (
                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-red-600 text-white text-[7px] sm:text-[8px] font-black px-1.5 py-0.5 rounded-full uppercase tracking-wider shadow-md border border-white/20 whitespace-nowrap z-30">
                            ❌ Discard
                        </div>
                    )}
                    <div className="text-[8px] sm:text-xs font-bold leading-none">{card.char}</div>
                    <div className="text-center text-base sm:text-lg leading-none flex-grow flex items-center justify-center">{card.suit}</div>
                    <div className="text-[8px] sm:text-xs font-bold leading-none text-right rotate-180">{card.char}</div>
                </div>
            );
        };

        // ---------- Player Area (for opponents) ----------
        const PlayerArea = ({ name, hand, hidden, actionText, clothes, onToggleCloth, playstyle }) => (
            <div className="flex flex-col items-center w-max px-2">
                <div className="flex items-center gap-1 mb-2">
                    <span className="font-bold text-xs sm:text-sm bg-black/60 text-white px-3 py-0.5 rounded-full border border-white/10 truncate max-w-[120px] sm:max-w-[150px]">{name}</span>
                    {playstyle && playstyle !== 'normal' && (
                        <span className="text-[10px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded-full border border-amber-500/30">{playstyle}</span>
                    )}
                </div>
                
                <div className="flex gap-1.5 sm:gap-2.5">
                    {hand.map((c, i) => <Card key={i} card={c} hidden={hidden} />)}
                </div>
                
                <div className={`mt-2 text-[9px] sm:text-xxs font-bold px-2 py-0.5 rounded shadow transition-opacity duration-300 border border-blue-200/30 ${actionText ? 'opacity-100 bg-white text-blue-900' : 'opacity-0'}`}>
                    {actionText || '...'}
                </div>
                
                <div className="mt-2 flex flex-wrap justify-center gap-1 w-full max-w-[200px]">
                    {clothes.map((item, idx) => (
                        <button
                            key={idx}
                            onClick={() => onToggleCloth(idx)}
                            className={`text-[8px] sm:text-xxs px-1.5 py-0.5 rounded border transition-all ${
                                item.stripped 
                                ? 'bg-red-950/80 text-red-400 border-red-800 line-through decoration-red-500 opacity-60' 
                                : 'bg-slate-800/80 text-gray-200 border-slate-700 hover:bg-slate-700'
                            }`}
                        >
                            {item.stripped ? '🔥' : '👗'} {item.name}
                        </button>
                    ))}
                </div>
            </div>
        );

        // ---------- Main App ----------
        function App() {
            const [state, setState] = useState('START');
            const [deck, setDeck] = useState([]);
            const [config, setConfig] = useState(loadConfig());
            const [clothesState, setClothesState] = useState({ player: [], opponents: [] });
            
            const [hands, setHands] = useState({ player: [], opponents: [] });
            const [discards, setDiscards] = useState([]);
            const [actions, setActions] = useState({ player: '', opponents: [] });
            const [standings, setStandings] = useState(null);
            const [rpLog, setRpLog] = useState('');
            const [showLogModal, setShowLogModal] = useState(false);
            const [copied, setCopied] = useState(false);

            useEffect(() => {
                saveConfig(config);
            }, [config]);

            useEffect(() => {
                if (clothesState.player && clothesState.player.length > 0) {
                    try {
                        localStorage.setItem(STORAGE_KEYS.clothesState, JSON.stringify(clothesState));
                    } catch (e) {}
                }
            }, [clothesState]);

            const parseClothesString = (str) => str.split(',').map(s => s.trim()).filter(s => s).map(s => ({ name: s, stripped: false }));

            const toggleClothing = (owner, index) => {
                setClothesState(prev => {
                    if (owner === 'player') {
                        const newPlayer = [...prev.player];
                        newPlayer[index] = { ...newPlayer[index], stripped: !newPlayer[index].stripped };
                        return { ...prev, player: newPlayer };
                    } else {
                        const oppIdx = parseInt(owner.split('_')[1]);
                        const newOpponents = [...prev.opponents];
                        newOpponents[oppIdx] = [...newOpponents[oppIdx]];
                        newOpponents[oppIdx][index] = { ...newOpponents[oppIdx][index], stripped: !newOpponents[oppIdx][index].stripped };
                        return { ...prev, opponents: newOpponents };
                    }
                });
            };

            const startGame = () => {
                const numOpp = config.numOpponents || 2;
                const opponents = config.opponents.slice(0, numOpp);
                
                let currentDeck = getDeck();
                const playerHand = currentDeck.splice(0, 5);
                const oppHands = [];
                for (let i = 0; i < numOpp; i++) {
                    oppHands.push(currentDeck.splice(0, 5));
                }
                
                setDeck(currentDeck);
                setHands({ player: playerHand, opponents: oppHands });
                setDiscards([]);
                setActions({ player: '', opponents: new Array(numOpp).fill('') });
                setStandings(null);
                setRpLog('');
                setShowLogModal(false);

                const playerClothes = parseClothesString(config.playerClothes);
                const oppClothesList = opponents.map(opp => parseClothesString(opp.clothes));
                
                let savedState = { player: [], opponents: [] };
                try {
                    const stored = localStorage.getItem(STORAGE_KEYS.clothesState);
                    if (stored) savedState = JSON.parse(stored);
                } catch(e) {}

                playerClothes.forEach(c => {
                    const matchingSaved = savedState.player?.find(sc => sc.name === c.name);
                    if (matchingSaved) c.stripped = matchingSaved.stripped;
                });

                oppClothesList.forEach((clothesArr, idx) => {
                    clothesArr.forEach(c => {
                        const matchingSaved = savedState.opponents?.[idx]?.find(sc => sc.name === c.name);
                        if (matchingSaved) c.stripped = matchingSaved.stripped;
                    });
                });

                setClothesState({ player: playerClothes, opponents: oppClothesList });
                setState('PLAYING');
            };

            const toggleDiscard = (index) => {
                setDiscards(prev => prev.includes(index) ? prev.filter(i => i !== index) : [...prev, index]);
            };

            const doDrawAndShowdown = () => {
                setState('DRAWING');
                const currentDeck = [...deck];
                const newHands = { player: [...hands.player], opponents: hands.opponents.map(h => [...h]) };
                const newActions = { player: '', opponents: new Array(config.numOpponents).fill('') };
                const opponents = config.opponents.slice(0, config.numOpponents);

                const playerDiscards = [...discards].sort((a,b) => b-a);
                newActions.player = playerDiscards.length > 0 ? `Discarded ${playerDiscards.length}` : 'Kept all';
                
                // Player rigged draw logic
                if (config.playerPlaystyle === 'lucky' || config.playerPlaystyle === 'unlucky') {
                    const drawnCards = drawCardsWithLuck(currentDeck, playerDiscards.length, config.playerPlaystyle === 'lucky');
                    playerDiscards.forEach((idx, j) => { newHands.player[idx] = drawnCards[j]; });
                } else {
                    playerDiscards.forEach(idx => { newHands.player[idx] = currentDeck.shift(); });
                }

                // Opponents draw logic
                for (let i = 0; i < config.numOpponents; i++) {
                    const playstyle = opponents[i].playstyle;
                    const discardIdxs = getAIDiscards(newHands.opponents[i], playstyle);
                    const count = discardIdxs.length;
                    newActions.opponents[i] = count > 0 ? `Discarded ${count}` : 'Kept all';
                    
                    if (playstyle === 'lucky' || playstyle === 'unlucky') {
                        const drawnCards = drawCardsWithLuck(currentDeck, count, playstyle === 'lucky');
                        discardIdxs.forEach((idx, j) => { newHands.opponents[i][idx] = drawnCards[j]; });
                    } else {
                        discardIdxs.sort((a,b) => b-a);
                        discardIdxs.forEach(idx => { newHands.opponents[i][idx] = currentDeck.shift(); });
                    }
                }

                setDeck(currentDeck);
                setHands(newHands);
                setActions(newActions);
                setDiscards([]);

                setTimeout(() => {
                    const evals = [];
                    evals.push({ role: 'player', name: config.playerName || '{{user}}', eval: evaluateHand(newHands.player) });
                    opponents.forEach((opp, i) => {
                        evals.push({ role: `opp_${i}`, name: opp.name, eval: evaluateHand(newHands.opponents[i]), playstyle: opp.playstyle });
                    });
                    evals.sort((a,b) => b.eval.score - a.eval.score);
                    evals[0].rank = 1;
                    for (let i = 1; i < evals.length; i++) {
                        evals[i].rank = evals[i].eval.score === evals[i-1].eval.score ? evals[i-1].rank : i + 1;
                    }
                    setStandings(evals);
                    setState('SHOWDOWN');
                }, 1500);
            };

            const generateAndShowRpLog = () => {
                const opponents = config.opponents.slice(0, config.numOpponents);
                const formatHandStr = (h) => h.map(c => c.char + c.suit).join(' ');
                
                let logText = `--- STRIP POKER ROUND ---\n`;
                logText += `Participants: You (${config.playerName}) vs ${opponents.map(o=>o.name).join(' & ')}\n\n`;
                
                logText += `[ACTION PHASE]\n`;
                logText += `• You: ${actions.player}\n`;
                opponents.forEach((opp, i) => {
                    logText += `• ${opp.name}: ${actions.opponents[i]}\n`;
                });

                logText += `\n[SHOWDOWN PHASE]\n`;
                const playerEval = evaluateHand(hands.player);
                logText += `• You revealed [${formatHandStr(hands.player)}] - ${playerEval.rankName}\n`;
                opponents.forEach((opp, i) => {
                    const e = evaluateHand(hands.opponents[i]);
                    logText += `• ${opp.name} revealed [${formatHandStr(hands.opponents[i])}] - ${e.rankName}\n`;
                });

                logText += `\n[RESULTS]\n`;
                standings.forEach(p => {
                    let icon;
                    if (p.rank === 1) icon = '🥇 Winner';
                    else if (p.rank === standings[standings.length - 1].rank && p.rank !== 1) icon = '💥 Loser (STRIPS!)';
                    else icon = `#${p.rank}`;
                    logText += `${icon}: ${p.name}\n`;
                });

                logText += `\n[CURRENT WARDROBE STATUS]\n`;
                const formatClothes = (list) => list.map(c => `${c.name} (${c.stripped ? '🔥 STRIPPED' : 'WORN'})`).join(', ');
                logText += `• You: ${formatClothes(clothesState.player)}\n`;
                opponents.forEach((opp, i) => {
                    logText += `• ${opp.name}: ${formatClothes(clothesState.opponents[i] || [])}\n`;
                });

                setRpLog(logText);
                setShowLogModal(true);
            };

            const handleCopyLog = () => {
                navigator.clipboard?.writeText(rpLog).then(() => {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = rpLog;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                });
            };

            const resetToDefaults = () => {
                if(confirm("Are you sure? This will wipe all data and reset back to Gwen & Maya.")) {
                    localStorage.removeItem(STORAGE_KEYS.config);
                    localStorage.removeItem(STORAGE_KEYS.clothesState);
                    setConfig(DEFAULT_CONFIG);
                    setClothesState({ player: [], opponents: [] });
                }
            };

            const activeOpponents = config.opponents.slice(0, config.numOpponents);
            const playerName = config.playerName.trim() || '{{user}}';

            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-2 font-sans">
                    {/* Roleplay Log Modal */}
                    {showLogModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm animate-fade-in">
                            <div className="bg-slate-800 border border-amber-500/30 rounded-2xl w-full max-w-lg p-6 shadow-2xl flex flex-col max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-black text-amber-400 mb-2">Roleplay Log Generated</h3>
                                <p className="text-xs text-gray-400 mb-4">Copy this text to paste directly into your RP.</p>
                                <textarea readOnly value={rpLog} className="w-full h-64 bg-slate-900 text-gray-300 p-4 rounded-lg border border-slate-700 font-mono text-xs mb-4 resize-none focus:outline-none" />
                                <div className="flex gap-3">
                                    <button onClick={handleCopyLog} className={`flex-1 py-3 rounded-lg font-bold ${copied ? 'bg-green-600' : 'bg-blue-600 hover:bg-blue-500'} text-white transition-colors`}>
                                        {copied ? '✅ Copied to Clipboard!' : '📋 Copy Log'}
                                    </button>
                                    <button onClick={() => setShowLogModal(false)} className="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-lg font-bold transition-colors">Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {state === 'START' ? (
                        <div className="text-center animate-fade-in px-2 w-full max-w-lg my-4">
                            <h1 className="text-3xl sm:text-4xl font-black text-amber-400 drop-shadow-lg mb-2">STRIP POKER RP</h1>
                            <div className="bg-white/5 px-4 py-2 rounded-xl border border-white/5 mb-4 inline-block">
                                <p className="text-xs text-gray-200 font-semibold">Gwen & Maya Edition</p>
                            </div>

                            <div className="bg-slate-800/80 backdrop-blur-md p-5 rounded-2xl border border-slate-700 text-left mb-4 shadow-xl space-y-4">
                                <div className="flex justify-between items-center mb-2">
                                    {/* The fix happens right here: Safely wrapping {{user}} in strings so React doesn't crash */}
                                    <h3 className="text-amber-400 font-bold uppercase tracking-wider text-xs">👤 Your Setup ({"{{user}}"})</h3>
                                    <button onClick={resetToDefaults} className="text-[10px] font-semibold bg-red-900/40 text-red-400 hover:bg-red-800/60 px-2 py-1 rounded border border-red-800/50 transition-colors">
                                        Reset All Data
                                    </button>
                                </div>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-3 border-b border-slate-700">
                                    <div>
                                        <label className="text-[10px] text-gray-400 mb-1 block">Your Name</label>
                                        <input type="text" value={config.playerName} onChange={e => setConfig({...config, playerName: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm text-white focus:outline-none focus:border-amber-500/50" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-amber-400 mb-1 block font-bold">Rig Your Own Draws (Luck)</label>
                                        <select value={config.playerPlaystyle || 'normal'} onChange={e => setConfig({...config, playerPlaystyle: e.target.value})} className="w-full bg-slate-900 border border-amber-500/30 rounded px-1 py-1.5 text-sm text-white focus:outline-none focus:border-amber-500">
                                            <option value="normal">Fair Play (Normal)</option>
                                            <option value="lucky">Always Lucky (Rigged Win)</option>
                                            <option value="unlucky">Always Unlucky (Rigged Lose)</option>
                                        </select>
                                    </div>
                                    <div className="col-span-1 sm:col-span-2">
                                        <label className="text-[10px] text-gray-400 mb-1 block">Your Clothes (Comma separated)</label>
                                        <input type="text" value={config.playerClothes} onChange={e => setConfig({...config, playerClothes: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm text-white focus:outline-none focus:border-amber-500/50" />
                                    </div>
                                </div>

                                <h3 className="text-amber-400 font-bold uppercase tracking-wider text-xs pt-1">🤖 Opponent Bots</h3>
                                
                                {activeOpponents.map((opp, idx) => (
                                    <div key={idx} className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                            <div>
                                                <label className="text-[10px] text-gray-400 mb-1 block">Name</label>
                                                <input type="text" value={opp.name} onChange={e => {
                                                    const newOpps = [...config.opponents];
                                                    newOpps[idx] = {...newOpps[idx], name: e.target.value};
                                                    setConfig({...config, opponents: newOpps});
                                                }} className="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-amber-500/50" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] text-amber-400 mb-1 block font-bold">Rig Bot's Draws (Luck)</label>
                                                <select value={opp.playstyle} onChange={e => {
                                                    const newOpps = [...config.opponents];
                                                    newOpps[idx] = {...newOpps[idx], playstyle: e.target.value};
                                                    setConfig({...config, opponents: newOpps});
                                                }} className="w-full bg-slate-800 border border-amber-500/30 rounded px-1 py-1 text-xs text-white focus:outline-none focus:border-amber-500">
                                                    <option value="normal">Fair Play (Normal)</option>
                                                    <option value="risky">Risky (Goes for big hands)</option>
                                                    <option value="safe">Safe (Keeps high cards)</option>
                                                    <option value="lucky">Always Lucky (Rigged Win)</option>
                                                    <option value="unlucky">Always Unlucky (Rigged Lose)</option>
                                                </select>
                                            </div>
                                            <div className="col-span-1 sm:col-span-3">
                                                <label className="text-[10px] text-gray-400 mb-1 block">Clothes (Comma separated)</label>
                                                <input type="text" value={opp.clothes} onChange={e => {
                                                    const newOpps = [...config.opponents];
                                                    newOpps[idx] = {...newOpps[idx], clothes: e.target.value};
                                                    setConfig({...config, opponents: newOpps});
                                                }} className="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-amber-500/50" />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <button onClick={startGame} className="w-full bg-gradient-to-r from-emerald-600 to-emerald-800 hover:from-emerald-500 hover:to-emerald-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition-transform active:scale-95 text-lg border border-emerald-500/30">
                                Start Strip Poker
                            </button>
                        </div>
                    ) : (
                        <div className="relative w-full max-w-4xl bg-gradient-to-b from-emerald-700 to-emerald-900 rounded-[32px] sm:rounded-[48px] border-[6px] sm:border-[10px] border-[#4a2e1b] shadow-[0_20px_50px_rgba(0,0,0,0.8)] flex flex-col justify-between py-4 sm:py-6 px-2 min-h-[500px] max-h-[95vh] overflow-hidden">
                            <div className="absolute inset-0 rounded-[24px] sm:rounded-[38px] shadow-[inset_0_0_60px_rgba(0,0,0,0.5)] pointer-events-none"></div>
                            
                            <div className="absolute top-3 left-1/2 -translate-x-1/2 bg-amber-900/90 text-amber-100 border border-amber-600/50 px-3 py-0.5 rounded-full text-[9px] sm:text-xs font-bold shadow z-10 whitespace-nowrap">
                                👙 RP Strip Mode
                            </div>

                            {/* Center Notification Overlays */}
                            {state === 'PLAYING' && (
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/60 px-4 py-2 rounded-full text-white text-xs sm:text-sm font-semibold animate-pulse text-center z-20 pointer-events-none">
                                    Tap cards to discard
                                </div>
                            )}
                            {state === 'DRAWING' && (
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/80 px-6 py-3 rounded-2xl text-white font-bold text-lg animate-pulse text-center z-20 pointer-events-none">
                                    Drawing...
                                </div>
                            )}

                            {/* Opponents Area */}
                            <div className="mt-8 mb-4 z-10 w-full overflow-x-auto custom-scrollbar pb-2">
                                <div className="flex gap-8 sm:gap-12 items-start px-4 sm:px-8 w-max mx-auto">
                                    {activeOpponents.map((opp, i) => (
                                        <PlayerArea
                                            key={i}
                                            name={opp.name}
                                            hand={hands.opponents[i] || []}
                                            hidden={state !== 'SHOWDOWN'}
                                            actionText={actions.opponents[i]}
                                            clothes={clothesState.opponents[i] || []}
                                            onToggleCloth={(idx) => toggleClothing(`opp_${i}`, idx)}
                                            playstyle={opp.playstyle}
                                        />
                                    ))}
                                </div>
                            </div>

                            {/* Showdown Modal */}
                            {state === 'SHOWDOWN' && standings && (
                                <div className="absolute inset-0 bg-black/70 backdrop-blur-xs z-30 flex items-center justify-center p-4 rounded-[24px] sm:rounded-[38px]">
                                    <div className="bg-black/95 p-4 sm:p-5 w-full max-w-sm rounded-2xl flex flex-col items-center shadow-[0_0_30px_rgba(0,0,0,0.8)] border border-amber-500/30 animate-fade-in max-h-[90%] overflow-y-auto">
                                        <h2 className="text-xl sm:text-2xl font-black text-amber-400 mb-3 drop-shadow-md">Showdown Results</h2>
                                        <div className="flex flex-col gap-2 w-full mb-4">
                                            {standings.map((p, idx) => {
                                                const maxRank = Math.max(...standings.map(s => s.rank));
                                                const isWorst = p.rank === maxRank && maxRank > 1;
                                                const bg = p.rank === 1 ? 'bg-yellow-500/20 border-yellow-500/50' : (isWorst ? 'bg-red-900/40 border-red-700/60' : 'bg-slate-300/10 border-slate-300/30');
                                                const label = p.rank === 1 ? '🥇' : (isWorst ? '💥' : '🥈');
                                                return (
                                                    <div key={idx} className={`flex items-center justify-between p-2 sm:p-3 rounded-xl border ${bg}`}>
                                                        <div className="flex items-center gap-2 truncate">
                                                            <span className="text-sm sm:text-base">{label}</span>
                                                            <span className={`font-bold text-xs sm:text-sm ${p.role === 'player' ? 'text-white' : 'text-gray-300'}`}>{p.name}</span>
                                                        </div>
                                                        <span className="text-xxs sm:text-xs text-gray-300 ml-2 font-medium">{p.eval.rankName}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        <div className="text-center text-xs text-red-400 mb-3 font-bold">
                                            Whoever has the 💥 must take off a piece of clothing! (Click it to cross it out)
                                        </div>
                                        <div className="flex flex-col gap-2 w-full">
                                            <button onClick={generateAndShowRpLog} className="bg-slate-700 hover:bg-slate-600 text-white py-2.5 rounded-xl font-bold text-xs sm:text-sm shadow-md transition-colors">📋 Generate RP Log</button>
                                            <button onClick={() => startGame()} className="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black py-2.5 rounded-xl font-bold text-xs sm:text-sm transition-transform active:scale-95">Deal Next Round</button>
                                            <button onClick={() => setState('START')} className="bg-transparent hover:bg-white/10 text-gray-300 py-2 rounded-xl font-bold text-xs transition-colors">Back to Setup</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Player Area */}
                            <div className="flex flex-col items-center gap-3 z-10 mb-2 mt-auto">
                                <div className="flex gap-1.5 sm:gap-2.5">
                                    {hands.player.map((c, i) => (
                                        <Card
                                            key={i}
                                            card={c}
                                            selected={discards.includes(i)}
                                            onClick={state === 'PLAYING' ? () => toggleDiscard(i) : undefined}
                                        />
                                    ))}
                                </div>
                                <div className="flex flex-wrap justify-center gap-1 w-full max-w-[320px]">
                                    {clothesState.player.map((item, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => toggleClothing('player', idx)}
                                            className={`text-[8px] sm:text-xxs px-2 py-1 rounded border transition-all ${
                                                item.stripped 
                                                ? 'bg-red-950/80 text-red-400 border-red-800 line-through decoration-red-500 opacity-60' 
                                                : 'bg-slate-800/80 text-gray-200 border-slate-700 hover:bg-slate-700'
                                            }`}
                                        >
                                            {item.stripped ? '🔥' : '👗'} {item.name}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex items-center gap-3 min-h-[2.5rem]">
                                    <div className="flex items-center gap-1">
                                        <span className="font-bold text-sm sm:text-base bg-black/60 text-white px-5 py-1.5 rounded-full border border-white/10 truncate max-w-[180px]">{playerName}</span>
                                        {config.playerPlaystyle && config.playerPlaystyle !== 'normal' && (
                                            <span className="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-1 rounded-full border border-amber-500/30">{config.playerPlaystyle}</span>
                                        )}
                                    </div>
                                    {state === 'PLAYING' && (
                                        <button onClick={doDrawAndShowdown} className="bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-500 hover:to-blue-700 text-white font-bold py-1.5 sm:py-2 px-5 rounded-full shadow-lg active:scale-95 text-xs sm:text-sm border border-blue-400/30 transition-transform">
                                            Confirm Discards & Showdown
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
